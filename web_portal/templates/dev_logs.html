<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Консоль разработчика - ДрайвКонтроль</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: #2d2d30;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #569cd6; font-size: 24px; }
        .btn {
            padding: 10px 20px;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { background: #1177bb; }
        .log-container {
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            padding: 15px;
            max-height: 700px;
            overflow-y: auto;
        }
        .log-entry {
            padding: 8px 12px;
            border-bottom: 1px solid #2d2d30;
            font-size: 13px;
            line-height: 1.5;
        }
        .log-entry:hover { background: #2d2d30; }
        .log-time { color: #858585; margin-right: 10px; }
        .log-level {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 10px;
            font-size: 11px;
        }
        .level-INFO { background: #0e639c; color: white; }
        .level-DEBUG { background: #3c3c3c; color: #d4d4d4; }
        .level-WARNING { background: #d19a66; color: #1e1e1e; }
        .level-ERROR { background: #f44747; color: white; }
        .log-message { color: #d4d4d4; }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #858585;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔧 Консоль разработчика</h1>
        <div>
            <a href="/admin" class="btn">← Назад в админку</a>
        </div>
    </div>

    <div class="log-container">
        {% if logs %}
            {% for log in logs %}
            <div class="log-entry">
                <span class="log-time">{{ log.time }}</span>
                <span class="log-level level-{{ log.level }}">{{ log.level }}</span>
                <span class="log-message">{{ log.message }}</span>
            </div>
            {% endfor %}
        {% else %}
            <div class="empty-state">
                <p>Логи пусты</p>
            </div>
        {% endif %}
    </div>
</div>
</body>
</html>
